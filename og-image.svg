<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2A3A"/>
      <stop offset="50%" stop-color="#243444"/>
      <stop offset="100%" stop-color="#1C2D3E"/>
    </linearGradient>
    <linearGradient id="lb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E4A62"/>
      <stop offset="100%" stop-color="#1C2F42"/>
    </linearGradient>
    <linearGradient id="lt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BAFC4"/>
      <stop offset="100%" stop-color="#6892A8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M 52 0 L 0 0 0 52" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow -->
  <ellipse cx="980" cy="180" rx="320" ry="280" fill="rgba(80,130,190,0.18)" filter="url(#blur)"/>
  <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>

  <!-- Logo mark -->
  <g transform="translate(80, 60)">
    <rect width="72" height="72" rx="14" fill="url(#lb)"/>
    <rect x="10" y="8" width="52" height="4" rx="2" fill="url(#lt)"/>
    <text x="36" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white" text-anchor="middle" letter-spacing="-1">IT</text>
    <rect x="10" y="48" width="52" height="1" rx="0.5" fill="rgba(255,255,255,0.15)"/>
    <text x="36" y="68" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="rgba(255,255,255,0.88)" text-anchor="middle" letter-spacing="-1">CG</text>
  </g>

  <!-- Company name -->
  <text x="170" y="88" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="rgba(255,255,255,0.9)" letter-spacing="0.5">IT Consult Group</text>
  <text x="170" y="112" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">ОФИЦИАЛЬНЫЙ ПАРТНЁР CYBERUS · УЗБЕКИСТАН</text>

  <!-- Divider -->
  <rect x="80" y="145" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Badge -->
  <rect x="80" y="172" width="220" height="34" rx="17" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="190" y="194" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#34D399" text-anchor="middle" letter-spacing="1">БЕСПЛАТНОЕ КИБЕРИСПЫТАНИЕ</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-3">Проверим защиту</text>
  <text x="80" y="368" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#34D399" letter-spacing="-3">бесплатно</text>

  <!-- Sub -->
  <text x="80" y="432" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" letter-spacing="0">Независимые исследователи атакуют реальную инфраструктуру.</text>
  <text x="80" y="462" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">Узнаёте факт: взломали или нет. Никаких обязательных платежей.</text>

  <!-- Divider -->
  <rect x="80" y="506" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Stats row -->
  <text x="80" y="546" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white">3/5</text>
  <text x="80" y="568" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">компаний взломали</text>

  <text x="290" y="546" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white">34 мин</text>
  <text x="290" y="568" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">рекорд взлома</text>

  <text x="520" y="546" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white">1500+</text>
  <text x="520" y="568" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">исследователей</text>

  <!-- CTA right -->
  <rect x="870" y="510" width="290" height="56" rx="12" fill="#2563EB"/>
  <text x="1015" y="544" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="white" text-anchor="middle">Пройти проверку →</text>

  <!-- URL -->
  <text x="870" y="582" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.38)">itcg.uz</text>
</svg>
